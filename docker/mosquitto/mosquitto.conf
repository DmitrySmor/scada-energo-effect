# =============================================================================
# Конфигурация MQTT-брокера Eclipse Mosquitto (ТЗ, разделы 4–6).
# Монтируется в контейнер mosquitto в /mosquitto/config/mosquitto.conf.
# =============================================================================

# --- Порты -------------------------------------------------------------------
# Незашифрованный порт доступен ТОЛЬКО внутри docker-сети scada_internal
# (для backend'а). Наружу (на хосте) не публикуется в compose.yaml.
listener 1883
protocol mqtt

# Защищённый TLS-порт для всех внешних устройств (публикуется как 8883).
listener 8883
protocol mqtt
cafile   /mosquitto/config/certs/ca.crt        # цепочка CA для проверки клиентов
certfile /mosquitto/config/certs/server.crt    # сертификат сервера
keyfile  /mosquitto/config/certs/server.key    # закрытый ключ сервера
tls_version 1.2                                # минимальная версия TLS

# --- Аутентификация (ТЗ, п.4: анонимный доступ запрещён) ---------------------
allow_anonymous false                          # без учётных данных — отказ
password_file /mosquitto/config/passwd         # индивидуальные креды устройств
# Скрипт добавления устройства: scripts/add_device.sh (см. README в docs/).

# --- ACL (ТЗ, п.4: устройство пишет только в свои топики) --------------------
acl_file /mosquitto/config/acl                 # правила по группам пользователей
# Для MQTТ 5 при необходимости включите:
# (проверку ownership topica дополнительно выполняет backend — ТЗ, п.4)

# --- Персистентность и QoS 1 (ТЗ, п.5) ----------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 180

# Очередь офлайн-сообщений с QoS 1 для подтверждённых подписок
max_queued_messages 1000
queue_mode first
message_size_limit 65536

# --- Сессии (ТЗ, п.5.2) --------------------------------------------------------
# Mosquitto 2.x поддерживает MQTT 5; параметры session-expiry согласуются
# отдельно (вопрос из ТЗ, п.21). По умолчанию clean_session false — очередь
# переживает кратковременные разрывы связи устройства.
persistent_client_expiration 7d

# --- Логирование (ТЗ, п.4, 16) --------------------------------------------------
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
# Логируем неудачные аутентификации и нарушения ACL:
connection_messages true
