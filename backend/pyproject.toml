# Зависимости backend (ТЗ п.2: Python, FastAPI, Pydantic).
# Версии фиксируйте poetry lock / uv lock при начале разработки.
[tool.poetry]
name = "scada-backend"
version = "0.1.0"
description = "SCADA Backend: приём, проверка, хранение и выдача данных приборов учёта"
authors = ["DmitrySmor"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.8"
pydantic-settings = "^2.4"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
aiomqtt = "^2.0"          # MQTT 5 клиент (версия брокера — согласование, ТЗ п.21)
python-jose = { extras = ["cryptography"], version = "^3.3" }  # JWT
passlib = { extras = ["bcrypt"], version = "^1.7" }            # хеши паролей (ТЗ п.15)
jsonschema = "^4.23"      # валидация data по схемам устройств (ТЗ п.7)
httpx = "^0.27"
fabric = "^3.2"           # задачи планировщика (docker/tasks/tasks.toml)

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.5"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
